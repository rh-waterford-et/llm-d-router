apiVersion: apps/v1
kind: Deployment
metadata:
  name: stt-backend-simulator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stt-simulator
  template:
    metadata:
      labels:
        app: stt-simulator
        llm-d.ai/inferenceServing: "true"
        llm-d.ai/model-arch: "encoder-decoder-stt"
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
      - name: simulator
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - stt-model-v1
        - --port
        - "8000"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 2
          periodSeconds: 1
          failureThreshold: 30
          timeoutSeconds: 1
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 10
          failureThreshold: 3
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          periodSeconds: 5
          failureThreshold: 1
          timeoutSeconds: 1
