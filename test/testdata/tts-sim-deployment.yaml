apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tinyllama-1-1b-chat-v1-0-inference-pool
      llm-d.ai/model-arch: "autoregressive-tts"
  template:
    metadata:
      labels:
        app: tinyllama-1-1b-chat-v1-0-inference-pool
        llm-d.ai/model-arch: "autoregressive-tts"
        inference.networking.k8s.io/engine-type: vllm
    spec:
      containers:
      - name: tts-sim
        image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
        imagePullPolicy: IfNotPresent
        args:
        - --model
        - tts-1
        - --port
        - "8000"
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          requests:
            cpu: 10m
