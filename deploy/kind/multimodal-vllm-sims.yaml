---
# TTS Backend Simulator
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tts-vllm-sim
  namespace: default
  labels:
    app: food-review-inference-pool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: food-review-inference-pool
      workload-type: tts
  template:
    metadata:
      labels:
        app: food-review-inference-pool
        workload-type: tts
        llm-d.ai/model-arch: autoregressive-tts
        llm-d.ai/inferenceServing: "true"
    spec:
      containers:
      - name: routing-sidecar
        image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:dev
        imagePullPolicy: IfNotPresent
        args:
        - --port=8000
        - --vllm-port=8200
        - --kv-connector=nixlv2
        - --secure-proxy=false
        - --data-parallel-size=1
        ports:
        - containerPort: 8000
          name: sidecar-http
          protocol: TCP
        env:
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
      - name: vllm
        image: ghcr.io/llm-d/llm-d-inference-sim:latest
        imagePullPolicy: IfNotPresent
        args:
        - --port=8200
        - --model=tts-1
        - --enable-kvcache=false
        - --kv-cache-size=1024
        - --block-size=16
        - --zmq-endpoint=tcp://food-review-endpoint-picker.default.svc.cluster.local:5557
        - --event-batch-size=16
        - --data-parallel-size=1
        ports:
        - containerPort: 8200
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8200"
        - name: PYTHONHASHSEED
          value: "42"

