# The epd-pool/multimodal-pool EPP Deployments (components/inference-gateway/)
# mount ConfigMaps named "epp-config" and "multimodal-epp-config" that
# neither component actually creates - on kind, these are applied
# out-of-band by the dev-env Makefile/script, not by kustomize. Copied here
# (content matches what's live on the kind-istio dev cluster) so this
# environment is fully self-contained via `kubectl apply -k`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: epp-config
data:
  epp-config.yaml: |
    # Sample EPP configuration for running without P/D
    # with small hash block size for simulation purposes
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: approx-prefix-cache-producer
      parameters:
        maxPrefixTokensToMatch: 16384
        lruCapacityPerServer: 31250
    - type: prefix-cache-scorer
    - type: decode-filter
    - type: max-score-picker
    - type: single-profile-handler
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: decode-filter
      - pluginRef: max-score-picker
      - pluginRef: prefix-cache-scorer
        weight: 2
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: multimodal-epp-config
data:
  epp-config.yaml: |
    # EPP configuration for multimodal routing from a single EPP instance.
    # The modality-filter inspects the request path and selects endpoints whose
    # llm-d.ai/model-arch label matches the path's compatible architectures.
    # Paths not in the mapping (e.g. /v1/chat/completions) pass all endpoints.
    apiVersion: llm-d.ai/v1alpha1
    kind: EndpointPickerConfig
    plugins:
    - type: queue-scorer
    - type: modality-filter
    - type: max-score-picker
    - type: single-profile-handler
    schedulingProfiles:
    - name: default
      plugins:
      - pluginRef: modality-filter
      - pluginRef: max-score-picker
      - pluginRef: queue-scorer
        weight: 1
