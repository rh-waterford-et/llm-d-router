# WARNING: Only use in testing scenarios.
# Istio-specific (mTLS override for the ext_proc gRPC call to EPP). This
# resource has no equivalent on agentgateway/OpenShift — do not apply it there.
# Host must match the EPP Service name (${EPP_NAME}), not ${EPP_NAME}-decode.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ${EPP_NAME}-insecure-tls
spec:
  host: ${EPP_NAME}
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
---
# WARNING: Only use in testing scenarios. Istio-specific; skip on agentgateway/OpenShift.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ${MULTIMODAL_EPP_NAME}-insecure-tls
spec:
  host: ${MULTIMODAL_EPP_NAME}
  trafficPolicy:
    tls:
      mode: SIMPLE
      insecureSkipVerify: true
