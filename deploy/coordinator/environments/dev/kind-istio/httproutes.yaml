---
# Requests with EPP-Phase: decode come from the coordinator's gateway client;
# route them to the decode InferencePool so the EPP can pick a decode pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${POOL_NAME}-decode-route
  labels:
    istio.io/rev: llm-d-gateway
spec:
  parentRefs:
  - name: ${GATEWAY_NAME}
  rules:
  - matches:
    - headers:
      - type: Exact
        name: EPP-Profile
        value: decode
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      # Must match the InferencePool name from epd-pool (${POOL_NAME}), not ${POOL_NAME}-decode.
      name: ${POOL_NAME}
      port: 8000
    timeouts:
      request: 300s
---
# Passthrough requests from the coordinator carry EPP-Profile: multimodal;
# route them to the multimodal InferencePool so the EPP can pick a TTS/STT pod.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: multimodal-route
  labels:
    istio.io/rev: llm-d-gateway
spec:
  parentRefs:
  - name: ${GATEWAY_NAME}
  rules:
  - matches:
    - headers:
      - type: Exact
        name: EPP-Profile
        value: multimodal
    backendRefs:
    - group: inference.networking.k8s.io
      kind: InferencePool
      name: ${MULTIMODAL_POOL_NAME}
      port: 8000
    timeouts:
      request: 300s
---
# Default rule: all other requests (from external clients) reach the coordinator.
# Do NOT add path-only routes for /v1/audio/* or /v1/images/* here — they also
# match Coordinator→Gateway passthrough hops (which set EPP-Profile: multimodal)
# and can steal traffic from multimodal-route, causing a request loop / HTTP 431.
# External RFC paths still hit the Coordinator via this PathPrefix: / catch-all.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${POOL_NAME}-coordinator-route
  labels:
    istio.io/rev: llm-d-gateway
spec:
  parentRefs:
  - name: ${GATEWAY_NAME}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    # Coordinator Service name is fixed (deploy/coordinator/components/coordinator/deployment.yaml)
    # regardless of Gateway provider (Istio on kind, agentgateway on OpenShift).
    - name: llm-d-coordinator
      port: 8080
    timeouts:
      request: 300s
