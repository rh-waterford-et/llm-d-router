apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${MULTIMODAL_EPP_NAME}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${MULTIMODAL_EPP_NAME}-binding
subjects:
- kind: ServiceAccount
  name: ${MULTIMODAL_EPP_NAME}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: epp-reader
---
apiVersion: v1
kind: Service
metadata:
  name: ${MULTIMODAL_EPP_NAME}
  labels:
    app: ${MULTIMODAL_EPP_NAME}
spec:
  selector:
    app: ${MULTIMODAL_EPP_NAME}
  ports:
  - name: default
    protocol: TCP
    port: 9002
    targetPort: 9002
    appProtocol: http2
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${MULTIMODAL_EPP_NAME}
  labels:
    app: ${MULTIMODAL_EPP_NAME}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${MULTIMODAL_EPP_NAME}
  template:
    metadata:
      labels:
        app: ${MULTIMODAL_EPP_NAME}
    spec:
      serviceAccountName: ${MULTIMODAL_EPP_NAME}
      terminationGracePeriodSeconds: 130
      containers:
      - name: epp
        image: ${EPP_IMAGE}
        imagePullPolicy: IfNotPresent
        args:
        - --pool-name
        - "${MULTIMODAL_POOL_NAME}"
        - --pool-namespace
        - "${NAMESPACE}"
        - --v
        - "4"
        - --zap-encoder
        - "json"
        - --grpc-port
        - "9002"
        - --grpc-health-port
        - "9003"
        - --config-file
        - "/etc/epp/epp-config.yaml"
        - --allow-experimental-plugins=true
        - --metrics-endpoint-auth=${METRICS_ENDPOINT_AUTH}
        ports:
        - containerPort: 9002
        - containerPort: 9003
        - name: metrics
          containerPort: 9090
        livenessProbe:
          grpc:
            port: 9003
            service: envoy.service.ext_proc.v3.ExternalProcessor
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 9003
            service: envoy.service.ext_proc.v3.ExternalProcessor
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: epp-config
          mountPath: /etc/epp
      volumes:
      - name: epp-config
        configMap:
          name: multimodal-epp-config
