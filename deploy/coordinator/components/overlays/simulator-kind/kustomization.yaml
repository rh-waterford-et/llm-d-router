# Coordinator simulator overlay for kind dev environments.
# Like overlays/simulator but without --zmq-endpoint: the coordinator EPP does
# not expose port 5557 (no KV-cache messaging path through the coordinator).
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
- target:
    kind: Deployment
    name: vllm-d
  patch: |
    - op: add
      path: /spec/template/spec/containers/0/args/0
      value: "--mode=${VLLM_SIM_MODE}"
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: "--force-dummy-tokenizer"
    - op: add
      path: /spec/template/spec/containers/0/args/-
      value: "--max-model-len=131072"
